services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ritmo}
      POSTGRES_USER: ${DB_USER:-ritmo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ritmo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ritmo} -d ${DB_NAME:-ritmo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Só dev: a imagem não roda migrations (em produção use docker-compose.prod.yml).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/alembic
          target: /app/alembic
        - action: rebuild
          path: ./backend/uv.lock
    environment:
      AMBIENTE: dev
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ritmo}:${DB_PASSWORD:-ritmo}@postgres:5432/${DB_NAME:-ritmo}
      CORS_ORIGENS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
